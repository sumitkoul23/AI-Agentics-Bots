<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a5f3b4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#21262d" stroke-width="1" opacity="0.6">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>

  <!-- Glowing orb left -->
  <circle cx="120" cy="160" r="80" fill="#58a6ff" opacity="0.06"/>
  <!-- Glowing orb right -->
  <circle cx="1160" cy="160" r="80" fill="#a5f3b4" opacity="0.06"/>

  <!-- Agent node dots (decorative) -->
  <g fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.35">
    <circle cx="80"  cy="100" r="4"/>
    <circle cx="160" cy="200" r="4"/>
    <circle cx="220" cy="80"  r="4"/>
    <circle cx="1060" cy="100" r="4"/>
    <circle cx="1140" cy="210" r="4"/>
    <circle cx="1200" cy="85"  r="4"/>
  </g>
  <g stroke="#a5f3b4" stroke-width="1" opacity="0.2">
    <line x1="80" y1="100" x2="160" y2="200"/>
    <line x1="160" y1="200" x2="220" y2="80"/>
    <line x1="1060" y1="100" x2="1140" y2="210"/>
    <line x1="1140" y1="210" x2="1200" y2="85"/>
  </g>

  <!-- Gradient accent bar -->
  <rect x="490" y="228" width="300" height="3" rx="2" fill="url(#accent)" opacity="0.8"/>

  <!-- Main title -->
  <text x="640" y="130" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="64" font-weight="700" text-anchor="middle"
        fill="url(#accent)" filter="url(#glow)">Bodhi</text>

  <!-- Subtitle -->
  <text x="640" y="180" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="22" font-weight="400" text-anchor="middle" fill="#8b949e">
    Autonomous AI Swarm · 12 Specialist Agents · 100% On-Device
  </text>

  <!-- Tags row -->
  <g font-family="'Segoe UI', monospace, sans-serif" font-size="13" fill="#30363d">
    <!-- Tag backgrounds -->
    <rect x="286" y="250" width="100" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="396" y="250" width="88" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="494" y="250" width="100" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="604" y="250" width="72" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="686" y="250" width="110" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="806" y="250" width="90" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="906" y="250" width="90" height="26" rx="13" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <!-- Tag text -->
    <text x="336" y="267" text-anchor="middle" fill="#58a6ff">🔒 No Cloud</text>
    <text x="440" y="267" text-anchor="middle" fill="#a5f3b4">🆓 Free</text>
    <text x="544" y="267" text-anchor="middle" fill="#f78166">🧠 Ollama</text>
    <text x="640" y="267" text-anchor="middle" fill="#d2a8ff">Go</text>
    <text x="741" y="267" text-anchor="middle" fill="#79c0ff">📱 PWA</text>
    <text x="851" y="267" text-anchor="middle" fill="#56d364">Self-learns</text>
    <text x="951" y="267" text-anchor="middle" fill="#ffa657">Offline ✅</text>
  </g>
</svg>
