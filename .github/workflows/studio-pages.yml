# Build + deploy the Chain Deployment Studio to GitHub Pages (free hosting,
# free *.github.io domain). The standalone build inlines everything into one
# HTML file, so the full wizard runs client-side with no server.
name: studio-pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/studio-pages.yml"
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build standalone site
        run: |
          python web/build_standalone.py web/dist/index.html
          test -f web/dist/index.html
          # Disable Jekyll so files are served verbatim.
          touch web/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
